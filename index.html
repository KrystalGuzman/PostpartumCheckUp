  <title>Postpartum Check-Up</title>
  <meta name="description" content="A screening check-up that helps a postpartum parent recognise patterns in how they are doing and work out what level of support might make sense. Not a diagnostic tool." />
  <meta name="robots" content="noindex" />

<body>
  <main class="wrap" id="app">
    <noscript>
      <h1>Postpartum Check-Up</h1>
      <p>This check-up needs JavaScript to run. Nothing you enter leaves your device either way.</p>
      <p>If you need help now and cannot use this page: contact your local emergency number, or in the US call or text 988, or call the National Maternal Mental Health Hotline on 1-833-852-6262.</p>
    </noscript>
  </main>
  <script type="module" src="./src/ui/app.js"></script>
